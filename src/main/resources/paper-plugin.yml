name: Posse
version: '${version}'
main: com.extantape.posse.PossePlugin
api-version: '26.1'
description: Sets who can hear whom in chat and private messages, with chat circles, blocked commands and a word filter.
website: https://github.com/ExtantApe/Posse
# Commands are registered with Brigadier in code, so there is no commands section.
dependencies:
  server:
    # Optional. Only so Posse can see BlueMapMini's share event class and filter /hud share like chat.
    BlueMapMini:
      load: BEFORE
      required: false
      join-classpath: true
permissions:
  posse.bypass:
    description: Reach, and be reached by, everyone, for moderators. It doesn't show anyone else's chat.
    default: false
  posse.filter.bypass:
    description: Skip the word filter in chat, private messages, signs, books and item names, for adult groups.
    default: false
  posse.circles:
    description: Use /circles to see your circles and who can hear you.
    default: true
  posse.circles.names:
    description: See names, not just a count, in /circles.
    default: true
  posse.admin:
    description: Use /posse reload, status and check, and hear about config problems on joining.
    default: op
